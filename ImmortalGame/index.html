<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>凡人修仙录 · 坊市（等距视角）</title>
<link rel="stylesheet" href="css/iso.css?v=20260913b">
</head>
<body>

<!-- ===== 游戏画布（最底层，接收鼠标/触摸） ===== -->
<canvas id="game"></canvas>

<!-- ===== UI 覆盖层：整体 pointer-events:none 让点击穿透到 canvas ===== -->
<div id="uiLayer">

  <!-- 左上：角色状态栏 -->
  <div id="statusBar" class="uiPanel">
    <div id="avatar"></div>
    <div id="statusRight">
      <div class="row1">
        <span id="pName">逍遥长生</span>
        <span id="pPower">战 1268</span>
      </div>
      <div class="bar hp"><div id="barHp"></div><span id="txtHp">860 / 860</span></div>
      <div class="bar mp"><div id="barMp"></div><span id="txtMp">420 / 420</span></div>
    </div>
  </div>

  <!-- 右上：小地图 + 时辰 + 任务列表 -->
  <div id="infoBar">
    <canvas id="minimap" width="132" height="132"></canvas>
    <div id="clock">未时二刻</div>
    <div id="questBox" class="uiPanel">
      <div class="qTitle">任 务</div>
      <div class="qItem"><span class="qName">拜入青玄宗</span></div>
      <div class="qItem" id="itemTalk"><span class="qName">与接引弟子对话</span><span class="qProg" id="qTalk">0/1</span></div>
      <div class="qItem"><span class="qName">采集灵药</span><span class="qProg" id="qHerb">2/3</span></div>
      <div class="qItem"><span class="qName">试炼之路</span></div>
    </div>
  </div>

  <!-- 底部：技能栏 + 功能按钮 -->
  <div id="bottomBar">
    <div id="skillBar">
      <div class="skill interactive"><span class="skName">剑诀</span><span class="skKey">1</span></div>
      <div class="skill interactive"><span class="skName">灵力弹</span><span class="skKey">2</span></div>
      <div class="skill interactive"><span class="skName">身法</span><span class="skKey">3</span></div>
      <div class="skill interactive"><span class="skName">护体</span><span class="skKey">4</span></div>
    </div>
    <div id="funcBar">
      <div class="func interactive">境界</div>
      <div class="func interactive">角色</div>
      <div class="func interactive">功法</div>
      <div class="func interactive">背包</div>
      <div class="func interactive">炼器</div>
      <div class="func interactive">设置</div>
    </div>

    <!-- 右下：屏幕缩放控制 -->
    <div id="zoomCtrl" class="uiPanel">
      <button id="zoomOut" class="zoomBtn" title="缩小">－</button>
      <span id="zoomLabel">110%</span>
      <button id="zoomIn" class="zoomBtn" title="放大">＋</button>
      <button id="zoomReset" class="zoomBtn small" title="复位">复位</button>
    </div>
  </div>

  <!-- 对话面板（交互元素，单独开启 pointer-events） -->
  <div id="dialog" class="uiPanel hidden interactive">
    <div id="dlgName">NPC</div>
    <div id="dlgText">……</div>
    <div id="dlgBtns"><button id="dlgClose">继续</button></div>
  </div>

  <div id="toast"></div>

  <!-- 竖屏提示（仅手机竖屏显示，纯提示不打断） -->
  <div id="rotateHint"><span class="rot">⟳</span>建议横屏体验<br>画面更完整</div>
</div>

<script>
/* 启动自检：任何脚本报错 / 资源加载失败 / 引擎未启动，都在屏幕上直接显示，
   便于手机端远程排障（截图即可看到原因）。引擎正常时不显示任何内容。 */
(function(){
  function show(msg){
    var el = document.getElementById('bootErr');
    if (!el){
      el = document.createElement('div');
      el.id = 'bootErr';
      el.style.cssText = 'position:fixed;left:10px;right:10px;bottom:130px;z-index:999;'
        + 'background:rgba(122,22,22,.93);color:#ffe0e0;font-size:12px;line-height:1.6;'
        + 'padding:9px 12px;border-radius:9px;word-break:break-all;pointer-events:none;';
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent = msg;
  }
  window.addEventListener('error', function(e){
    var t = e.target;
    if (t && t.tagName === 'IMG') return;                 // 素材缺失已有占位回退，不打扰
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')){
      show('⚠️ 资源加载失败：' + (t.src || t.href || '') + '\n请下拉刷新页面重试');
    } else {
      show('⚠️ 引擎报错：' + (e.message || '未知错误'));
    }
  }, true);
  setTimeout(function(){
    if (!window.__ISO__) show('⚠️ 引擎未能启动（脚本被内容拦截器挡住或加载超时）。\n请下拉刷新，或关闭 Safari 内容拦截器后重试。');
  }, 3500);
})();
</script>
<script src="js/iso.js?v=20260913b"></script>
</body>
</html>
