<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仙岛寻踪 · 多地图无缝流转</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#cfe8f6;
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;user-select:none}
  #game{display:block;width:100%;height:100%}

  .hud{position:fixed;pointer-events:none;z-index:10}
  .panel{background:linear-gradient(180deg,rgba(18,26,44,.88),rgba(10,16,30,.92));
    border:1px solid rgba(214,178,96,.55);border-radius:10px;
    box-shadow:0 6px 22px rgba(0,0,0,.35),inset 0 0 24px rgba(214,178,96,.08);
    color:#f0e3c2}
  #topleft{top:14px;left:14px;padding:10px 14px;min-width:190px}
  #topleft .name{font-size:19px;font-weight:700;color:#ffe6a6;letter-spacing:2px}
  #topleft .row{font-size:12.5px;color:#c9bda0;margin-top:5px;line-height:1.6}
  #topleft .row b{color:#8bf3ff;font-weight:600}

  #topright{top:14px;right:14px;padding:10px 12px}
  #topright .t{font-size:12px;color:#c9bda0;margin-bottom:7px;letter-spacing:1px}
  .maps{display:flex;gap:7px;pointer-events:auto}
  .maps button{pointer-events:auto;cursor:pointer;font-family:inherit;
    background:rgba(30,44,70,.85);color:#f0e3c2;border:1px solid rgba(214,178,96,.5);
    border-radius:7px;padding:6px 11px;font-size:13px;transition:.15s}
  .maps button:hover{background:rgba(58,84,128,.95);border-color:#ffd75e;color:#fff}
  .maps button.on{background:linear-gradient(180deg,#4a6da8,#2c4570);border-color:#ffd75e;
    color:#fff;box-shadow:0 0 10px rgba(255,215,94,.5)}

  #bottom{bottom:14px;left:50%;transform:translateX(-50%);padding:8px 16px;
    font-size:12.5px;color:#c9bda0;text-align:center;line-height:1.7}
  #bottom kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
    border-radius:4px;padding:1px 5px;font-family:inherit;color:#fff;font-size:11.5px}
  #bottom .hl{color:#8bf3ff}
  #loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0d1526;color:#ffe6a6;font-size:16px;letter-spacing:2px;z-index:99}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="topleft" class="hud panel">
  <div class="name" id="mapName">加载中…</div>
  <div class="row">坐标 <b id="pos">—</b></div>
  <div class="row" id="hint">踩上青色光门即可切换地图</div>
</div>

<div id="topright" class="hud panel">
  <div class="t">地图速切（无缝流转）</div>
  <div class="maps" id="mapBtns"></div>
</div>

<div id="bottom" class="hud panel">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> 行走　·　
  点击格子移动　·　走到 <span class="hl">青色光门</span> 自动切换地图（淡入淡出过渡）
</div>

<div id="loader">仙岛加载中…</div>

<script src="js/game.js"></script>
</body>
</html>
