<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>凡人修仙录 · 实时版</title>
  <meta name="description" content="修仙题材实时网页小游戏：操控修士探索灵脉、施飞剑斩妖兽、采灵草。飞剑随境界进化，妖兽与灵物各有其形。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hp-box">
        <div class="hp-bar"><span id="hp-fill"></span></div>
      </div>
      <div class="stat">灵草 <b id="herb-val">0</b></div>
      <div class="stat">斩妖 <b id="kill-val">0</b></div>
      <div class="stat">境界 <b id="realm-val">炼气期</b></div>
    </div>

    <!-- 突破提示 -->
    <div id="toast"></div>

    <!-- 浮动摇杆（左半屏触摸出现） -->
    <div id="joystick">
      <div id="joy-base"></div>
      <div id="joy-knob"></div>
    </div>

    <!-- 飞剑钮（半隐藏、可拖动摆放；SVG 剑图标） -->
    <div class="btn" id="btn-atk" aria-label="飞剑">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M12 2 L14 4 L13 14 L11 14 L10 4 Z" fill="#e3eeff"/>
        <rect x="8" y="14" width="8" height="2" fill="#d9b24a"/>
        <rect x="11" y="16" width="2" height="5" fill="#6b4a2f"/>
        <circle cx="12" cy="21.4" r="1.6" fill="#d9b24a"/>
      </svg>
    </div>

    <!-- 开场 -->
    <div class="overlay" id="intro">
      <h1>凡人修仙录 · 实时版</h1>
      <p>
        你是一名初入灵脉的修士。<br>
        电脑：<span class="key">W A S D</span> 移动，<span class="key">J / 空格</span> 发飞剑<br>
        手机：<b>左半屏按住拖动</b>移动，<b>右半屏点按</b>（或飞剑钮）出剑<br>
        斩妖越多，飞剑越厉害——单锋→双锋→追魂三剑→巨剑→五雷<br>
        妖兽有妖狼/毒蛛/火蟾/鬼面/灵蛇，灵物有灵草/灵石/丹药。
      </p>
      <button id="start-btn">入灵脉</button>
      <button class="ghost-btn" id="land-btn">⇄ 横屏全屏游玩</button>
      <p style="font-size:12px;opacity:.7"><a href="legacy/" style="color:#9a93d8">→ 也想玩文字版？</a></p>
    </div>

    <!-- 竖屏旋转引导（触屏竖屏时显示；转横屏或点「竖屏也能玩」后消失。网页无法强制转屏） -->
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <h2>请横置手机游玩</h2>
      <p>横屏视野更开阔，左手摇杆、右手出剑更顺手。<br>也可点「横屏全屏游玩」先进入全屏。</p>
      <button id="rotate-ok" class="ghost-btn">我知道了，竖屏也能玩</button>
    </div>

    <!-- 死亡 -->
    <div class="overlay" id="death">
      <h1 style="color:#e0464f">道心受创</h1>
      <p>灵脉凶险，且回洞府调息……</p>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    (function () {
      var intro = document.getElementById('intro');
      var rotateHint = document.getElementById('rotate-hint');
      var isTouch = window.matchMedia('(pointer: coarse)').matches;

      // 用真实视口尺寸判定横竖屏，比 CSS orientation 媒体查询可靠（iOS/全屏场景下后者会卡住）
      function updateOrientation() {
        if (!isTouch || !document.body.classList.contains('started') || rotateHint.dataset.dismissed) {
          document.body.classList.remove('show-rotate');
          return;
        }
        var portrait = window.innerHeight > window.innerWidth;
        document.body.classList.toggle('show-rotate', portrait);
      }

      function dismiss() {
        intro.style.display = 'none';
        document.body.classList.add('started');   // 进入游戏后才显示竖屏旋转引导
        updateOrientation();
      }
      document.getElementById('start-btn').addEventListener('click', dismiss);
      document.getElementById('start-btn').addEventListener('touchstart', function (e) { e.preventDefault(); dismiss(); }, { passive: false });

      // 旋转 / 尺寸变化都重新判定（iOS 旋转后需延迟读取真实尺寸）
      window.addEventListener('resize', updateOrientation);
      window.addEventListener('orientationchange', function () { setTimeout(updateOrientation, 300); });

      // 用户可手动忽略竖屏提示，绝不把人卡死
      document.getElementById('rotate-ok').addEventListener('click', function () {
        rotateHint.dataset.dismissed = '1';
        document.body.classList.remove('show-rotate');
      });

      // 横屏全屏游玩：Android Chrome 进全屏并锁定横屏；iOS 不支持全屏/锁屏，需手动旋转
      document.getElementById('land-btn').addEventListener('click', function () {
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) {
          try {
            var p = req.call(el);
            if (p && typeof p.then === 'function' && screen.orientation && screen.orientation.lock) {
              p.then(function () { try { screen.orientation.lock('landscape'); } catch (e) {} }).catch(function () {});
            }
          } catch (e) {}
        }
      });
    })();
  </script>
</body>
</html>
