<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>凡人修仙录 · 实时版</title>
  <meta name="description" content="修仙题材实时网页小游戏：操控修士在大地图上斩妖、采灵物、突破境界。每位修士各有武器与技能，突破可三选一构筑流派。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game"></canvas>

    <!-- HUD -->
    <div id="hud">
      <div class="hp-box">
        <div class="hp-bar"><span id="hp-fill"></span></div>
      </div>
      <div class="stat">斩妖 <b id="kill-val">0</b></div>
      <div class="stat">境界 <b id="realm-val">炼气期</b></div>
      <div class="stat">构筑 <b id="build-val">未悟</b></div>
      <div class="stat">兽潮 <b id="foe-val">5/8</b></div>
      <div class="stat">灵石 <b id="stone-val">0</b></div>
      <button id="btn-mute" class="hud-btn" aria-label="音效开关">🔊</button>
    </div>

    <!-- 突破提示 -->
    <div id="toast"></div>

    <!-- 浮动摇杆（左半屏触摸出现） -->
    <div id="joystick">
      <div id="joy-base"></div>
      <div id="joy-knob"></div>
    </div>

    <!-- 出招钮（半隐藏、可拖动摆放；SVG 剑图标） -->
    <div class="btn" id="btn-atk" aria-label="出招">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M12 2 L14 4 L13 14 L11 14 L10 4 Z" fill="#e3eeff"/>
        <rect x="8" y="14" width="8" height="2" fill="#d9b24a"/>
        <rect x="11" y="16" width="2" height="5" fill="#6b4a2f"/>
        <circle cx="12" cy="21.4" r="1.6" fill="#d9b24a"/>
      </svg>
    </div>

    <!-- 突破三选一 -->
    <div class="overlay" id="cardpick">
      <h1 class="card-title">突破 · 择一而悟</h1>
      <p id="card-sub" class="lead">感悟天地，取其一</p>
      <div id="card-list"></div>
    </div>

    <!-- 结算 -->
    <div class="overlay" id="result">
      <h1 id="res-title">道心受创</h1>
      <div id="res-body"></div>
      <div class="res-btns">
        <button id="again-btn">再来一局</button>
        <button id="home-btn" class="ghost-btn">回洞府</button>
      </div>
    </div>

    <!-- 开场 + 角色选择 + 洞府 -->
    <div class="overlay" id="intro">
      <h1>凡人修仙录 · 实时版</h1>
      <p class="lead">择一修士，入灵脉斩妖</p>
      <div id="char-select">
        <button class="char-card sel" data-char="sword">
          <span class="c-emoji">🗡️</span>
          <b>御剑仙</b><small>青袍剑修</small>
          <span class="c-desc">远程飞剑追踪<br>金丹起可穿透<br>气血 105</span>
        </button>
        <button class="char-card" data-char="thunder">
          <span class="c-emoji">⚡</span>
          <b>雷法真君</b><small>紫霄法修</small>
          <span class="c-desc">雷符全程穿透<br>射速快、清群强<br>气血 95</span>
        </button>
        <button class="char-card" data-char="blade">
          <span class="c-emoji">🔥</span>
          <b>赤焰刀客</b><small>烈焰武修</small>
          <span class="c-desc">近战扇形横扫<br>重创击退<br>气血 132</span>
        </button>
      </div>

      <div id="meta-box">
        <button id="meta-toggle" class="ghost-btn">洞府 · 灵石 <b id="meta-stone">0</b></button>
        <div id="meta-panel">
          <div class="meta-sec"><h3>经脉 · 永久强化</h3><div id="up-list"></div></div>
          <div class="meta-sec"><h3>今日任务</h3><div id="quest-list"></div></div>
          <div class="meta-sec"><h3>成就</h3><div id="ach-list"></div></div>
        </div>
      </div>

      <p class="ctrl-hint">
        电脑：<span class="key">W A S D</span> 移动，<span class="key">J / 空格</span> 出招<br>
        手机：左半屏拖动移动，右半屏点按（或出招钮）出招<br>
        地图很大，妖兽从视野外成波涌来；突破时三选一，本局越打越强<br>
        被围死即结束，成绩会记下来——破纪录只是差几只的事
      </p>
      <button id="start-btn">开始游戏</button>
      <p style="font-size:12px;opacity:.7"><a href="legacy/" style="color:#9a93d8">→ 也想玩文字版？</a></p>
    </div>

    <!-- 竖屏旋转引导（触屏竖屏时显示；转横屏或点「竖屏也能玩」后消失。网页无法强制转屏） -->
    <div id="rotate-hint">
      <div class="icon">📱</div>
      <h2>请横置手机游玩</h2>
      <p>横屏视野更开阔，左手摇杆、右手出招更顺手。</p>
      <button id="rotate-ok" class="ghost-btn">我知道了，竖屏也能玩</button>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    (function () {
      var intro = document.getElementById('intro');
      var result = document.getElementById('result');
      var rotateHint = document.getElementById('rotate-hint');
      var metaPanel = document.getElementById('meta-panel');
      var isTouch = window.matchMedia('(pointer: coarse)').matches;
      var selChar = 'sword';

      // 用真实视口尺寸判定横竖屏，比 CSS orientation 媒体查询可靠（iOS/全屏场景下后者会卡住）
      function updateOrientation() {
        if (!isTouch || !document.body.classList.contains('started') || rotateHint.dataset.dismissed) {
          document.body.classList.remove('show-rotate');
          return;
        }
        var portrait = window.innerHeight > window.innerWidth;
        document.body.classList.toggle('show-rotate', portrait);
      }

      function dismiss() {
        if (result) result.style.display = 'none';
        if (window.GameAPI) { window.GameAPI.selectChar(selChar); window.GameAPI.start(); }
        intro.style.display = 'none';
        document.body.classList.add('started');
        updateOrientation();
      }
      document.getElementById('start-btn').addEventListener('click', dismiss);
      document.getElementById('start-btn').addEventListener('touchstart', function (e) { e.preventDefault(); dismiss(); }, { passive: false });

      // 角色选择
      var cards = document.querySelectorAll('.char-card');
      function pick(c) {
        selChar = c.getAttribute('data-char');
        cards.forEach(function (x) { x.classList.remove('sel'); });
        c.classList.add('sel');
        if (window.GameAPI) window.GameAPI.selectChar(selChar);
      }
      cards.forEach(function (c) {
        c.addEventListener('click', function () { pick(c); });
        c.addEventListener('touchstart', function (e) { e.preventDefault(); pick(c); }, { passive: false });
      });

      // 结算面板按钮
      var againBtn = document.getElementById('again-btn');
      if (againBtn) againBtn.addEventListener('click', function () {
        if (result) result.style.display = 'none';
        if (window.GameAPI) window.GameAPI.again();
      });
      var homeBtn = document.getElementById('home-btn');
      if (homeBtn) homeBtn.addEventListener('click', function () {
        if (result) result.style.display = 'none';
        if (window.GameAPI) { window.GameAPI.openMeta(true); window.GameAPI.toHome(); }
        intro.style.display = 'flex';
        document.body.classList.remove('started');
        updateOrientation();
      });

      // 洞府面板展开/收起
      var metaToggle = document.getElementById('meta-toggle');
      if (metaToggle) metaToggle.addEventListener('click', function () {
        if (window.GameAPI) window.GameAPI.openMeta();
      });

      // 旋转 / 尺寸变化都重新判定（iOS 旋转后需延迟读取真实尺寸）
      window.addEventListener('resize', updateOrientation);
      window.addEventListener('orientationchange', function () { setTimeout(updateOrientation, 300); });

      // 用户可手动忽略竖屏提示，绝不把人卡死
      document.getElementById('rotate-ok').addEventListener('click', function () {
        rotateHint.dataset.dismissed = '1';
        document.body.classList.remove('show-rotate');
      });

      // 音效需在用户手势里解锁
      function unlock() { if (window.GameAPI && window.GameAPI.unlockAudio) window.GameAPI.unlockAudio(); }
      window.addEventListener('pointerdown', unlock, { once: true });
      window.addEventListener('keydown', unlock, { once: true });
    })();
  </script>
</body>
</html>
