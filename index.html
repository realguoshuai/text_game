<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>修仙小游戏 · 入口</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(184,142,72,.18), transparent 60%),
      radial-gradient(900px 500px at 50% 120%, rgba(120,80,30,.16), transparent 60%),
      linear-gradient(160deg, #14100a 0%, #0c0906 50%, #16110a 100%);
    color: #e8dcc4;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 18px 48px;
  }
  .wrap { width: 100%; max-width: 720px; }
  .title {
    text-align: center;
    margin-bottom: 6px;
    font-size: clamp(28px, 7vw, 44px);
    letter-spacing: .18em;
    font-weight: 700;
    background: linear-gradient(180deg, #f3d98a, #b8893f);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 18px rgba(184,142,72,.25);
  }
  .subtitle {
    text-align: center;
    color: #b9a888;
    letter-spacing: .22em;
    font-size: clamp(12px, 3.4vw, 15px);
    margin-bottom: 34px;
  }
  .cards { display: grid; grid-template-columns: 1fr; gap: 18px; }
  @media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }
  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    border: 1px solid rgba(184,142,72,.55);
    border-radius: 16px;
    padding: 22px 20px 20px;
    background: linear-gradient(160deg, rgba(30,22,11,.92), rgba(14,10,5,.92));
    box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset, 0 12px 40px rgba(0,0,0,.45), 0 0 24px rgba(184,142,72,.10);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    overflow: hidden;
  }
  .card::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(400px 200px at 50% 0%, rgba(184,142,72,.12), transparent 70%);
    opacity: 0; transition: opacity .18s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(243,217,138,.85);
    box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset, 0 18px 48px rgba(0,0,0,.5), 0 0 36px rgba(184,142,72,.28);
    outline: none;
  }
  .card:hover::after, .card:focus-visible::after { opacity: 1; }
  .card .badge {
    display: inline-block; font-size: 12px; letter-spacing: .2em;
    color: #d8b878; border: 1px solid rgba(184,142,72,.4);
    border-radius: 999px; padding: 3px 12px; margin-bottom: 14px;
  }
  .card h2 {
    font-size: 22px; letter-spacing: .08em; margin-bottom: 10px;
    color: #f1dcab;
  }
  .card p { color: #b6a98e; font-size: 14px; line-height: 1.7; }
  .card .go {
    margin-top: 16px; display: inline-flex; align-items: center; gap: 6px;
    color: #e8c989; font-size: 14px; letter-spacing: .1em;
  }
  .card .go .arrow { transition: transform .18s ease; }
  .card:hover .go .arrow { transform: translateX(4px); }
  .foot {
    text-align: center; color: #6f6450; font-size: 12px; letter-spacing: .12em;
    margin-top: 36px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="title">修仙小游戏</div>
    <div class="subtitle">— 选一处，入道 —</div>
    <div class="cards">
      <a class="card" href="ImmortalGame/">
        <span class="badge">等距 · 像素</span>
        <h2>修仙坊市</h2>
        <p>等距视角的修仙坊市。操控角色行走于街巷，与书生、商贩等 NPC 交谈，逛遍楼阁摊位。</p>
        <span class="go">进入坊市 <span class="arrow">→</span></span>
      </a>
      <a class="card" href="legacy/">
        <span class="badge">文字 · 养成</span>
        <h2>凡人问道录</h2>
        <p>文字修仙养成。历练、炼丹、宗门、秘境，一路从凡人问道长生。（旧版备份）</p>
        <span class="go">进入旧版 <span class="arrow">→</span></span>
      </a>
      <a class="card" href="ImmortalGame/battle/">
        <span class="badge">2D · 动作</span>
        <h2>坊市行 · 斩妖</h2>
        <p>俯视角动作修仙。挥剑斩妖、突破境界、搜刮灵石，于坊市与后山之间杀出一条长生路。</p>
        <span class="go">进入斩妖 <span class="arrow">→</span></span>
      </a>
    </div>
    <div class="foot">个人作品 · 非商业用途</div>
  </div>
</body>
</html>
